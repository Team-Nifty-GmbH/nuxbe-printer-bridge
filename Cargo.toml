[package]
name = "nuxbe-printer-bridge"
version = "0.1.20"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.4", features = ["json", "native-tls-vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tempfile = "3.27.0"
dirs = "6.0.0"
jiff = "0.2.34"
clap = { version = "4.6.3", features = ["derive"] }
cursive = { version = "0.21.1", default-features = false, features = ["crossterm-backend"] }
reverb-rs = { git = "https://github.com/Team-Nifty-GmbH/reverb_rs", branch = "main" }
async-trait = "0.1.91"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "std"] }
openssl-sys = { version = "0.9.117", features = ["vendored"] }
printers = "2.3.0"
tracing = "0.1.44"
urlencoding = "2.1.3"
tokio-util = "0.7.18"

[features]
default = []
vendored-openssl = ["openssl-sys/vendored"]
