name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      # Build inside Debian 12, so the binary asks for no newer glibc than
      # Debian 12 ships (2.36). A newer build image yields a binary that does
      # not start there, while one built against the older glibc runs on
      # everything newer.
      - name: Build in Debian 12
        run: |
          docker run --rm -v "$PWD":/src -w /src -e TARGET=${{ matrix.target }} rust:1-bookworm bash -euc '
            if [ "$TARGET" = aarch64-unknown-linux-gnu ]; then
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
              export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
              export PKG_CONFIG_ALLOW_CROSS=1
              export PKG_CONFIG_PATH=/usr/lib/aarch64-linux-gnu/pkgconfig
              dpkg --add-architecture arm64
              apt-get update
              apt-get install -y crossbuild-essential-arm64 libcups2-dev:arm64
            else
              apt-get update
              apt-get install -y libcups2-dev
            fi

            rustup target add "$TARGET"
            cargo build --release --target "$TARGET"

            glibc=$(grep -ao "GLIBC_2\.[0-9]*" "target/$TARGET/release/nuxbe-printer-bridge" | sort -uV | tail -1)
            echo "Newest glibc symbol: $glibc"
            [ "$(printf "%s\nGLIBC_2.36\n" "$glibc" | sort -V | tail -1)" = GLIBC_2.36 ]
          '

          mkdir -p artifacts
          tar czvf artifacts/nuxbe-printer-bridge-${{ matrix.target }}.tar.gz \
            -C target/${{ matrix.target }}/release nuxbe-printer-bridge

      # Upload artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuxbe-printer-bridge-${{ matrix.target }}
          path: artifacts/nuxbe-printer-bridge-${{ matrix.target }}.tar.gz
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all workflow run artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: find artifacts -type f | sort

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/nuxbe-printer-bridge-x86_64-unknown-linux-gnu/nuxbe-printer-bridge-x86_64-unknown-linux-gnu.tar.gz
            artifacts/nuxbe-printer-bridge-aarch64-unknown-linux-gnu/nuxbe-printer-bridge-aarch64-unknown-linux-gnu.tar.gz
          generate_release_notes: true